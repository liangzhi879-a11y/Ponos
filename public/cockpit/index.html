<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>银河驾驶舱 · 数据飞轮原型</title>
<style>
  :root, .theme-light {
    --orange:   #FF7429;   /* 品牌橙：两主题保持一致（对齐 YFWorking） */
    --orange-deep: #FF4200;
    --orange-mid:  #FFA268;
    --amber:    #FFB000;
    --slate:    #9AA1AC;
    /* 表面与文字 */
    --paper:  #FDF9F5;   --panel:  #FFFDFB;
    --card:   #FFFFFF;   --hv:     #FFFDFB;
    --ink:    #24272C;   --ink2:   #5E636C;  --faint: #9AA1AC;
    --line:   rgba(34,38,44,.10);
    /* 暖白氛围背景（整块 wash 随主题切换） */
    --bg-wash: radial-gradient(60vmax 46vmax at 16% 12%, rgba(255,176,120,.16), rgba(255,176,120,0) 62%),
               radial-gradient(52vmax 40vmax at 86% 22%, rgba(255,214,180,.20), rgba(255,214,180,0) 60%),
               radial-gradient(70vmax 52vmax at 50% 108%, rgba(255,190,140,.13), rgba(255,190,140,0) 60%),
               linear-gradient(180deg, #FFFCF8, #FBF3EC);
    /* 轨道与尘埃 */
    --ringO: #E7DCCE;   --ringM: rgba(122,100,80,.15);
    --bandC: rgba(255,116,41,.14);   --rimC: rgba(138,62,18,.26);
    --dustA: #FFB27D;   --dustB: #D8C6B8;
    /* 图标圆盘（站徽） */
    --em-a: #FFFFFF;    --em-b: #FFF6EF;
    --em-ring:  inset 0 0 0 4px rgba(255,255,255,.6);
    --em-ringH: inset 0 0 0 4px rgba(255,255,255,.75);
    --em-fg:  #FF4200;
    /* 强调文字（浅底深橙 / 深底亮橙） */
    --acc:  #FF4200;    --accbd: rgba(255,66,0,.35);
    /* 状态徽章 */
    --crun-fg:  #FF4200; --crun-bg:  #FFEDE1;
    --cwait-fg: #9A6600; --cwait-bg: #FFF3D6;
    --cidle-fg: #9AA1AC; --cidle-bg: #F0F1F3;
    --cnum-fg:  #5E636C; --cnum-bg:  #F3F1EE;
    /* 进度条 / 开关 / 下拉 / 面板头 / 键盘键 / 遮罩 */
    --track: #F0ECE6;   --swtrk: #E4E0DA;  --opt-hv: #FFF1E6;  --phdA: rgba(255,238,224,.85);
    --kbd-bg: rgba(255,255,255,.7);  --kbd-bd: rgba(34,38,44,.16);
    --veilc:  rgba(120,58,22,.14);
    /* JS 读取：面板圆点颜色（历史 / 空闲） */
    --c-hist: #E3D8CC;  --c-idle: #C6CBD2;
    --s: 1;                 /* 全局缩放基准（JS 计算） */
  }
  /* 深色主题：语义化覆盖（对齐 YFWorking .theme-dark 结构，品牌橙不变） */
  .theme-dark {
    --paper: #15110C;   --panel: #1B1610;
    --card:  #1E1812;   --hv:    #2A2116;
    --ink:   #F0E6D8;   --ink2:  #B8AFA2;  --faint: #8A8074;
    --line:  rgba(240,220,190,.12);
    --bg-wash: radial-gradient(60vmax 46vmax at 16% 12%, rgba(255,150,70,.10), rgba(255,150,70,0) 62%),
               radial-gradient(52vmax 40vmax at 86% 22%, rgba(255,120,50,.08), rgba(255,120,50,0) 60%),
               radial-gradient(70vmax 52vmax at 50% 108%, rgba(255,140,70,.07), rgba(255,140,70,0) 60%),
               linear-gradient(180deg, #1B150F, #0F0B07);
    --ringO: #3A3127;   --ringM: rgba(235,200,160,.10);
    --bandC: rgba(255,138,60,.20);   --rimC: rgba(0,0,0,.5);
    --dustA: #FF9A5F;   --dustB: #57493B;
    --em-a: #2C2419;    --em-b:  #171208;
    --em-ring:  inset 0 0 0 4px rgba(255,255,255,.06);
    --em-ringH: inset 0 0 0 4px rgba(255,255,255,.12);
    --em-fg:  #FFA268;
    --acc:  #FFA268;    --accbd: rgba(255,164,104,.5);
    --crun-fg:  #FFA268; --crun-bg:  rgba(255,116,41,.16);
    --cwait-fg: #FFC53D; --cwait-bg: rgba(255,176,0,.14);
    --cidle-fg: #A5A9B0; --cidle-bg: rgba(160,170,185,.14);
    --cnum-fg:  #B8AFA2; --cnum-bg:  rgba(255,255,255,.06);
    --track: #2E2720;   --swtrk: #3B3329;  --opt-hv: rgba(255,116,41,.13);  --phdA: rgba(255,116,41,.10);
    --kbd-bg: rgba(255,255,255,.07); --kbd-bd: rgba(255,255,255,.15);
    --veilc:  rgba(0,0,0,.55);
    --c-hist: #5A4B3B;  --c-idle: #6E675F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  b, strong { font-weight: 700; }

  /* ---------- 暖白氛围背景 ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background: var(--bg-wash); }
  .bg i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; will-change: transform; }
  .bg .a1 { width: 46vmax; height: 46vmax; left: -16vmax; top: -14vmax;
    background: radial-gradient(circle, rgba(255,158,90,.34), rgba(255,158,90,0) 68%);
    animation: dr 52s ease-in-out infinite alternate; }
  .bg .a2 { width: 40vmax; height: 40vmax; right: -12vmax; top: 4vmax;
    background: radial-gradient(circle, rgba(255,196,150,.30), rgba(255,196,150,0) 66%);
    animation: dr2 60s ease-in-out infinite alternate; }
  .bg .a3 { width: 42vmax; height: 42vmax; left: 14vmax; bottom: -18vmax;
    background: radial-gradient(circle, rgba(255,150,90,.20), rgba(255,150,90,0) 66%);
    animation: dr 68s ease-in-out infinite alternate-reverse; }
  @keyframes dr  { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(5vmax,3vmax,0) scale(1.12); } }
  @keyframes dr2 { from { transform: translate3d(0,0,0) scale(1.08); } to { transform: translate3d(-4vmax,5vmax,0) scale(1); } }

  /* ---------- 顶部 HUD ---------- */
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 8; pointer-events: none;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: calc(14px * var(--s)) calc(22px * var(--s)); }
  #hud .brand { display: flex; align-items: center; gap: calc(10px * var(--s)); }
  #hud .logo { width: calc(37px * var(--s)); height: calc(37px * var(--s)); flex: none;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 4px 10px rgba(255,90,15,.26)); }
  #hud .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #hud .brand .t { font-size: calc(19px * var(--s)); font-weight: 700; letter-spacing: .06em; line-height: 1.1; }
  #hud .brand .e { display: block; margin-top: 3px; font-size: calc(8.5px * var(--s)); letter-spacing: .34em;
    color: var(--faint); text-transform: uppercase; font-family: Arial, sans-serif; }

  /* 顶部橙底白字横幅（对应 PPT 正循环标语） */
  #ribbon { position: fixed; z-index: 7; top: calc(12px * var(--s)); left: 50%;
    transform: translateX(-50%); white-space: nowrap; pointer-events: none;
    display: flex; align-items: center; gap: calc(8px * var(--s));
    padding: calc(7px * var(--s)) calc(16px * var(--s)); border-radius: 999px;
    background: linear-gradient(90deg, #FF8A3D, #FF4200);
    box-shadow: 0 8px 24px rgba(255,90,15,.28), inset 0 1px 0 rgba(255,255,255,.28);
    font-size: calc(11.5px * var(--s)); color: #fff; letter-spacing: .02em; }
  #ribbon .ar { color: rgba(255,255,255,.85); font-size: calc(8px * var(--s)); }
  #ribbon b { font-weight: 700; }
  #ribbon em { font-style: normal; color: #FFE3CE; }

  #foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; pointer-events: none;
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
    padding: calc(8px * var(--s)) calc(20px * var(--s));
    font-size: calc(10px * var(--s)); color: var(--faint); letter-spacing: .1em; }
  /* 左下角操作帮助一段话 */
  #foot .help { text-align: left; font-size: calc(11px * var(--s)); color: var(--ink2);
    line-height: 1.9; letter-spacing: .02em; }
  #foot .help b { color: var(--acc); font-weight: 600; }
  #foot .help kbd { font-family: inherit; font-size: .9em; padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--kbd-bd); background: var(--kbd-bg); color: var(--ink2); }

  /* ---------- 画布层 ---------- */
  #orbits { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; display: block;
    pointer-events: none; }
  #orbits ellipse { fill: none; }
  /* 地面阴影：SVG 径向渐变（软边缘），避免 CSS blur 滤镜与逐帧动画同组导致的每帧重栅格化 */
  #orbits .gshad  { fill: url(#gShL); stroke: none; }
  .theme-dark #orbits .gshad { fill: url(#gShD); }
  #orbits .rOuter { stroke: var(--ringO); stroke-width: 1; stroke-dasharray: 3 9; }
  #orbits .rMid   { stroke: var(--ringM); stroke-width: 1; }
  #orbits .rim3d  { stroke: var(--rimC); }
  #orbits .rBand  { stroke: var(--bandC); }
  #orbits .flow1  { stroke: url(#gFlow); stroke-width: 3; opacity: .9;
    stroke-dasharray: 26 74; animation: flow 7.5s linear infinite; }
  #orbits .flow2  { stroke: #FFB27D; stroke-width: 2; opacity: .8;
    stroke-dasharray: 3 97; animation: flow 5s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -100; } }
  #dust  { position: fixed; inset: 0; z-index: 2; width: 100%; height: 100%; display: block; pointer-events: none; }
  .veil  { position: fixed; inset: 0; z-index: 5; background: var(--veilc);
    opacity: 0; pointer-events: none; transition: opacity .35s; }
  .veil.on { opacity: 1; }

  /* ---------- 六模块站 ---------- */
  #stations { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .station { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
    outline: none; border-radius: 16px; }
  .station:focus-visible { }
  .station .em { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
    width: calc(48px * var(--s)); height: calc(48px * var(--s)); border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, var(--em-a), var(--em-b) 78%);
    border: 1px solid rgba(255,116,41,.38);
    box-shadow: 0 4px 14px rgba(255,110,40,.12), var(--em-ring);
    display: flex; align-items: center; justify-content: center; color: var(--em-fg);
    transition: box-shadow .25s, border-color .25s; }
  .station .em::after { content: ""; position: absolute; inset: -7px; border-radius: 50%;
    border: 1px dashed rgba(255,116,41,0); transition: border-color .25s, transform .25s; }
  .station .em svg { width: 52%; height: 52%; }
  .station:hover .em, .station:focus-visible .em { border-color: var(--orange);
    box-shadow: 0 10px 26px rgba(255,90,15,.28), var(--em-ringH),
                0 0 0 2px rgba(255,116,41,.25); }
  .station:hover .em::after, .station:focus-visible .em::after { border-color: rgba(255,116,41,.6); transform: scale(1.06); }

  .station .card { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
    width: calc(206px * var(--s)); padding: calc(9px * var(--s)) calc(12px * var(--s)) calc(10px * var(--s));
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 8px 26px rgba(210,110,40,.07);
    transition: box-shadow .25s, border-color .25s, background .25s; }
  .station:hover .card, .station:focus-visible .card {
    border-color: rgba(255,116,41,.42);
    box-shadow: 0 14px 34px rgba(210,90,25,.16); background: var(--hv); }
  .card .row1 { display: flex; align-items: baseline; gap: 6px; }
  .card .num { font-size: calc(12px * var(--s)); font-weight: 700; color: #fff;
    background: linear-gradient(140deg, #FFA268, #FF4200); border-radius: 6px;
    padding: calc(1.5px * var(--s)) calc(6px * var(--s)); font-family: Arial; letter-spacing: .02em;
    box-shadow: 0 2px 6px rgba(255,90,15,.25); flex: none; }
  .card .nm { font-size: calc(15px * var(--s)); font-weight: 700; color: var(--orange); letter-spacing: .04em; }
  .card .ds { margin-top: calc(5px * var(--s)); font-size: calc(10.5px * var(--s)); color: var(--ink2);
    line-height: 1.62; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .mx { margin-top: calc(6px * var(--s)); display: flex; align-items: center; gap: 5px;
    font-size: calc(9.5px * var(--s)); color: var(--faint); letter-spacing: .02em; }
  .card .mx i { width: 6px; height: 6px; border-radius: 50%; background: var(--orange);
    box-shadow: 0 0 6px rgba(255,116,41,.7); flex: none; animation: blink 2.2s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- 中枢引擎 ---------- */
  #hub { position: fixed; left: 0; top: 0; z-index: 4; transform: translate(-50%,-50%);
    cursor: pointer; border-radius: 50%; pointer-events: auto; outline: none;
    background: radial-gradient(circle at 33% 27%, #FFC28F 0%, #FF8A3D 36%, #FF5A10 72%, #E53F00 100%);
    box-shadow: 0 calc(20px * var(--s)) calc(56px * var(--s)) rgba(255,80,10,.34),
                inset 0 2px 0 rgba(255,255,255,.4), inset 0 -8px 20px rgba(150,40,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; overflow: visible; }
  #hub::before { content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 1px solid rgba(255,116,41,.30); animation: breath 3.4s ease-in-out infinite; }
  #hub::after  { content: ""; position: absolute; inset: -20px; border-radius: 50%;
    border: 1px dashed rgba(255,116,41,.34);
    animation: hubspin 26s linear infinite; }
  @keyframes hubspin { to { transform: rotate(360deg); } }
  @keyframes breath { 0%,100% { transform: scale(1); opacity:.8; } 50% { transform: scale(1.12); opacity:.35; } }
  #hub:hover::before { border-color: rgba(255,180,120,.55); }
  #hub .cap { font-size: calc(8px * var(--s)); letter-spacing: .4em; text-transform: uppercase;
    color: rgba(255,255,255,.82); font-family: Arial; margin-bottom: calc(2px * var(--s)); }
  #hub .big { font-size: calc(21px * var(--s)); font-weight: 800; letter-spacing: .07em; line-height: 1.15;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    text-shadow: 0 2px 10px rgba(120,40,0,.35); }
  #hub .mid { margin-top: calc(4px * var(--s)); font-size: calc(9.5px * var(--s));
    color: #FFE7D2; letter-spacing: .12em; }
  #hub .st { margin-top: calc(7px * var(--s)); display: inline-flex; align-items: center; gap: 5px;
    font-size: calc(8.5px * var(--s)); letter-spacing: .14em; color: #fff;
    background: rgba(120,30,0,.22); padding: calc(2px * var(--s)) calc(9px * var(--s)); border-radius: 999px;
    border: 1px solid rgba(255,255,255,.25); }
  #hub .st i { width: 5px; height: 5px; border-radius: 50%; background: #fff;
    animation: blink 1.6s ease-in-out infinite; }

  /* ---------- 右侧面板 ---------- */
  #panel { position: fixed; z-index: 9; top: 0; right: 0; height: 100%;
    width: min(calc(392px * var(--s)), 94vw);
    background: var(--panel); border-left: 1px solid rgba(255,116,41,.18);
    box-shadow: -22px 0 60px rgba(120,58,22,.16);
    transform: translateX(106%);
    transition: transform .42s cubic-bezier(.22,.9,.28,1);
    display: flex; flex-direction: column; }
  #panel.open { transform: translateX(0); }
  #panel .p-head { position: relative; padding: calc(22px * var(--s)) calc(24px * var(--s)) calc(15px * var(--s));
    border-bottom: 1px solid var(--line); background:
      linear-gradient(180deg, var(--phdA), transparent 78%); }
  #panel .topline { position: absolute; top: 0; left: 24px; right: 24px; height: 2.5px;
    background: linear-gradient(90deg, var(--orange-mid), var(--orange-deep));
    box-shadow: 0 0 12px rgba(255,116,41,.55); }
  #panel .p-title { display: flex; align-items: center; gap: calc(11px * var(--s)); }
  #panel .p-title .orb { width: calc(30px * var(--s)); height: calc(30px * var(--s)); border-radius: 9px; flex: none;
    background: linear-gradient(140deg, #FFA268, #FF4200);
    box-shadow: 0 4px 12px rgba(255,90,15,.3), inset 0 1px 0 rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center; color: #fff; }
  #panel .p-title .orb svg { width: 56%; height: 56%; }
  #panel .p-title h2 { font-size: calc(19px * var(--s)); font-weight: 700; color: var(--ink); letter-spacing: .05em; }
  #panel .p-title .en { margin-left: auto; font-size: calc(9px * var(--s)); letter-spacing: .24em;
    color: var(--faint); font-family: Arial; text-transform: uppercase; }
  #panel .p-title .num { font-size: calc(9px * var(--s)); color: var(--acc); font-weight: 700;
    border: 1px solid var(--accbd); border-radius: 6px; padding: calc(1px * var(--s)) calc(5px * var(--s));
    font-family: Arial; }
  #panel .p-sub { margin-top: calc(9px * var(--s)); font-size: calc(12px * var(--s)); color: var(--ink2);
    line-height: 1.7; padding-right: 8px; }
  #panel .p-close { position: absolute; top: calc(14px * var(--s)); right: calc(14px * var(--s));
    width: calc(30px * var(--s)); height: calc(30px * var(--s)); display: flex; align-items: center;
    justify-content: center; cursor: pointer; border-radius: 9px; color: var(--faint);
    font-size: 14px; border: 1px solid transparent; transition: all .2s; background: transparent; }
  #panel .p-close:hover { color: var(--acc); background: rgba(255,116,41,.1);
    border-color: rgba(255,116,41,.2); }
  #panel .p-body { flex: 1; min-height: 0; overflow-y: auto; padding: calc(14px * var(--s)) calc(24px * var(--s)) calc(24px * var(--s));
    scrollbar-width: thin; scrollbar-color: rgba(255,116,41,.35) transparent; }
  #panel .p-body::-webkit-scrollbar { width: 6px; }
  #panel .p-body::-webkit-scrollbar-thumb { background: rgba(255,116,41,.3); border-radius: 3px; }

  .note { font-size: calc(10.5px * var(--s)); color: var(--faint); margin: 12px 0 0; line-height: 1.7; }
  .sec-title { margin: calc(15px * var(--s)) 0 calc(8px * var(--s)); font-size: calc(10px * var(--s));
    color: var(--acc); letter-spacing: .2em; font-weight: 700; }
  .sec-title:first-child { margin-top: 0; }

  .row { display: flex; align-items: center; gap: 10px; padding: calc(9px * var(--s)) calc(10px * var(--s));
    border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(120,58,22,.04);
    transition: border-color .2s, box-shadow .2s, transform .2s; }
  .row:hover { border-color: rgba(255,116,41,.3); box-shadow: 0 6px 16px rgba(255,110,40,.08); transform: translateX(2px); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { font-size: calc(13px * var(--s)); color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .m { font-size: calc(10.5px * var(--s)); color: var(--faint); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { flex: none; font-size: calc(9.5px * var(--s)); font-weight: 600;
    padding: 2px 9px; border-radius: 999px; letter-spacing: .05em; }
  .chip.c-run  { color: var(--crun-fg); background: var(--crun-bg); }
  .chip.c-wait { color: var(--cwait-fg); background: var(--cwait-bg); }
  .chip.c-idle { color: var(--cidle-fg); background: var(--cidle-bg); }
  .chip.c-num  { color: var(--cnum-fg); background: var(--cnum-bg); }
  .time { flex: none; font-size: calc(10px * var(--s)); color: var(--faint); }

  .bar { height: 6px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #FFA268, var(--orange-deep));
    box-shadow: 0 0 8px rgba(255,116,41,.4); }

  .agents { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .agent { padding: calc(10px * var(--s)) calc(11px * var(--s)); border-radius: 12px;
    background: var(--card); border: 1px solid var(--line); cursor: default;
    transition: border-color .2s, transform .2s, box-shadow .2s; }
  .agent:hover { border-color: rgba(255,116,41,.3); transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(255,110,40,.1); }
  .agent .a-top { display: flex; align-items: center; gap: 7px; }
  .agent .a-id { font-size: calc(13px * var(--s)); font-weight: 700; color: var(--ink); }
  .agent .a-role { font-size: calc(9.5px * var(--s)); color: var(--faint); margin-top: 4px; }
  .agent .st { margin-left: auto; font-size: calc(9px * var(--s)); display: flex; align-items: center;
    gap: 4px; color: var(--ink2); }
  .agent .st b { font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { text-align: center; padding: calc(11px * var(--s)) 6px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(120,58,22,.04); }
  .stat .v { font-size: calc(16px * var(--s)); font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums; font-family: Arial; }
  .stat .k { font-size: calc(9px * var(--s)); color: var(--faint); margin-top: 4px; letter-spacing: .08em; }
  .stat.up .v { color: var(--acc); }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: calc(108px * var(--s)); padding: 6px 2px 0; }
  .chart .c { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
    height: 100%; justify-content: flex-end; }
  .chart .c i { width: 100%; max-width: 24px; border-radius: 4px 4px 1px 1px;
    background: linear-gradient(180deg, #FFA268, rgba(255,116,41,.16));
    box-shadow: 0 0 6px rgba(255,116,41,.35); transform-origin: bottom;
    animation: rise .7s cubic-bezier(.2,.9,.3,1.2) both; }
  .chart .c span { font-size: calc(8.5px * var(--s)); color: var(--faint); }
  @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  .setting { display: flex; align-items: center; gap: 12px; padding: calc(11px * var(--s)) 6px;
    border-bottom: 1px solid var(--line); }
  .setting:last-child { border-bottom: none; }
  .setting .t { font-size: calc(13px * var(--s)); color: var(--ink); }
  .setting .m { font-size: calc(10.5px * var(--s)); color: var(--faint); margin-top: 3px; }
  .sw { position: relative; width: 40px; height: 22px; border-radius: 999px; flex: none;
    background: var(--swtrk); cursor: pointer; transition: background .25s; box-shadow: inset 0 1px 3px rgba(0,0,0,.08); }
  .sw::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 17px; height: 17px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); transition: transform .25s; }
  .sw.on { background: linear-gradient(90deg, #FF8A3D, var(--orange-deep)); }
  .sw.on::after { transform: translateX(18px); }
  .sw.disabled { opacity: .45; cursor: not-allowed; }

  .field { margin-top: 2px; }
  .field .lab { font-size: calc(10.5px * var(--s)); color: var(--faint); margin: 12px 0 6px; letter-spacing: .12em; }
  .sel { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(8px * var(--s)) calc(11px * var(--s)); border-radius: 10px; cursor: pointer;
    font-size: calc(13px * var(--s)); color: var(--ink); background: var(--card);
    border: 1px solid var(--line); transition: border-color .2s; }
  .sel:hover { border-color: rgba(255,116,41,.4); }
  .sel .arr { transition: transform .2s; color: var(--faint); font-size: 9px; }
  .sel.open .arr { transform: rotate(180deg); }
  .opts { display: none; margin-top: 5px; border-radius: 10px; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(120,58,22,.14); }
  .opts.show { display: block; }
  .opts .o { padding: calc(8px * var(--s)) calc(11px * var(--s)); font-size: calc(12px * var(--s));
    color: var(--ink2); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .opts .o:hover, .opts .o.sel2 { color: var(--acc); background: var(--opt-hv); }
  .opts .o.sel2 b { color: var(--acc); font-weight: 700; }

  .empty { padding: 24px 8px; text-align: center; color: var(--faint); font-size: 12px; line-height: 2; }

  /* ---------- 主题切换（对齐 YFWorking 浅色 / 深色两档） ---------- */
  #hud .hud-right { display: flex; align-items: center; gap: calc(14px * var(--s)); }
  .tseg { display: flex; align-items: center; gap: 2px; pointer-events: auto;
    padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    box-shadow: 0 2px 10px rgba(120,58,22,.08); }
  .tseg button { border: 0; background: transparent; cursor: pointer; outline: none;
    width: calc(27px * var(--s)); height: calc(25px * var(--s)); border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    color: var(--faint); font-size: calc(12.5px * var(--s)); line-height: 1;
    transition: background .25s, color .25s, box-shadow .25s, transform .2s; }
  .tseg button:hover { color: var(--acc); }
  .tseg button.on { background: linear-gradient(140deg, var(--orange-mid), var(--orange-deep));
    color: #fff; box-shadow: 0 3px 10px rgba(255,90,15,.35); }
  .tseg button:active { transform: scale(.92); }
  /* 深色主题强度校正 */
  .theme-dark .bg i { opacity: .16; }
  .theme-dark .station:hover .card { box-shadow: 0 16px 34px rgba(0,0,0,.45); }
  .theme-dark .tseg { box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .theme-dark #panel { box-shadow: -22px 0 60px rgba(0,0,0,.5); }
  body { transition: background .4s ease, color .4s ease; }

  /* speedMode：主程序经 yfw:theme 传入时，暂停全部装饰动画（CSS 侧暂停；canvas 帧在 frame() 内跳过绘制） */
  .cockpit-speed *, .cockpit-speed *::before, .cockpit-speed *::after {
    animation-play-state: paused !important; transition-duration: .001s !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; }
  }
  @media (max-width: 900px) {
    #ribbon { display: none; }
  }
</style>
<script>/* 首帧前应用主题，避免闪烁。
   作为 iframe 嵌入时主程序以 URL query 驱动（?theme=dark|light）；独立打开时 fallback localStorage（同源共享）；file:// 下 localStorage 受限由 try 兜底 */
try{ var _q=new URLSearchParams(location.search).get('theme');
     var _t=(_q==='dark'||_q==='light')?_q:localStorage.getItem('yfw-cockpit-theme');
     document.documentElement.classList.add(_t==='dark'?'theme-dark':'theme-light'); }
catch(e){ document.documentElement.classList.add('theme-light'); }
</script>

"use strict";
/* ================================================================
   消息桥（iframe ⇄ 父窗口）
   · 父 → 本页：{ type:'yfw:theme', mode:'light'|'dark', speedMode:boolean }  主题 + 动画开关
   · 父 → 本页：{ type:'yfw:overview', data:overview }                       六模块运行数据注入
   · 本页 → 父：{ type:'yfw:ready' } / { type:'yfw:hub-click' } / { type:'yfw:theme-change' }

                     agents:{id,role,state:'run'|'idle'|'think'|'review'}[],
                     usage:{token,requests,costUsd}, skills:{count,sample[]}, health:{engine,kernel} }
   ================================================================ */
let cockpitData = null; let cockpitSpeed = false;
const host = window.parent;
window.addEventListener('message', (e) => {
  if (e.source !== window.parent) return
  const d = e.data || {}
  if (d.type === 'yfw:theme') {
    applyTheme(d.mode === 'light' ? 'light' : 'dark')
    setSpeed(d.speedMode === true)
  } else if (d.type === 'yfw:overview') { cockpitData = d.data || null; renderStations(); if (panelOpen && lastModule) renderPanel(lastModule) }
})
function setSpeed(on){ cockpitSpeed = on; document.documentElement.classList.toggle('cockpit-speed', on) }
function notifyHost(type){ try { host.postMessage({ type }, '*') } catch (e) {} }
function ready(){ notifyHost('yfw:ready') }
function signalReady(){ if (document.readyState === 'complete') { setTimeout(ready, 0) } else { window.addEventListener('load', () => setTimeout(ready, 0)) } }

/* ================================================================
   几何与布局（6 站顺时针分布于倾斜飞轮轨道）
   ================================================================ */
let W=0,H=0,U=0,CX=0,CY=0,RX=0,RY=0,EM=0,HUB=0;
const ringG=document.getElementById('ringG');
const ringFlow=document.getElementById('ringFlow');
const stationsEl=document.getElementById('stations');

/* 飞轮整体滚转角（弧度 ≈ -12.6°）：椭圆压扁 + 屏面旋转，贴近 PPT 的透视圆盘 */
const ROT=-0.22;
const _cR=Math.cos(ROT), _sR=Math.sin(ROT);
function ringXY(phi,r=1){   // 倾斜扁椭圆上一点（phi：自顶部顺时针，r 为半径缩放）
  const dx=RX*Math.sin(phi)*r, dy=-RY*Math.cos(phi)*r;
  return [CX+dx*_cR-dy*_sR, CY+dx*_sR+dy*_cR];
}

function buildStations(){
  stationsEl.innerHTML='';
  MODULES.forEach((m,i)=>{
    const s=document.createElement('div');
    s.className='station';
    s.tabIndex=0; s.setAttribute('role','button');
    s.setAttribute('aria-label',m.name+'：'+m.sub);
    s.innerHTML=`
      <div class="em">${m.glyph}</div>
      <div class="card">
        <div class="row1"><span class="num">${m.idx}</span><span class="nm">${m.name}</span></div>
        <div class="ds">${m.sub}</div>
        <div class="mx"><i></i><span>${stationMeta(m)}</span></div>
      </div>`;
    s.addEventListener('click',e=>{ e.stopPropagation(); openPanel(m.id); });
    s.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); openPanel(m.id); } });
    s.addEventListener('mouseenter',()=>{ hoverId=m.id; });
    s.addEventListener('mouseleave',()=>{ if(hoverId===m.id) hoverId=null; });
    stationsEl.appendChild(s);
    s._m=m;
  });
}
/* 各站状态行（.mx）文案：注入 cockpitData 时按模块推导实时概览，否则用模块静态默认 meta */
function stationMeta(m){
  const d=cockpitData;
  if(!d) return m.meta;
  switch(m.id){
    case 'sessions':
    case 'tasks':{
      if(!Array.isArray(d.runningTasks)) return WAIT_NOTE;
      const t=d.runningTasks;
      if(!t.length) return '暂无任务';
      const ex=t.filter(x=>x.status==='exec').length;
      if(m.id==='sessions'){
        const wa=t.filter(x=>x.status==='wait').length;
        return t.length+' 项任务 · '+ex+' 执行 / '+wa+' 等待';
      }
      const pr=t.filter(x=>typeof x.progress==='number').length;
      return t.length+' 项任务 · '+pr+' 含进度';
    }
    case 'agents':{
      if(!Array.isArray(d.agents)) return WAIT_NOTE;
      const a=d.agents;
      if(!a.length) return '暂无智能体';
      const busy=a.filter(x=>(x.state||'idle')!=='idle').length;
      return a.length+' 智能体 · '+busy+' 忙碌';
    }
    case 'kb':{
      if(!d.skills) return WAIT_NOTE;
      const s=d.skills;
      return (typeof s.count==='number'&&s.count>0)?s.count+' 项技能就绪':'暂无技能';
    }
    case 'usage':{
      if(!d.usage) return WAIT_NOTE;
      const u=d.usage;
      return (u.token!=null&&u.token!=='')?('今日 '+u.token):'暂无用量';
    }
    default: return m.meta;
  }
}
/* 六站卡片状态行刷新：overview 到达或主题重绘后调用（DOM 就地更新，无需重排布局） */
function renderStations(){
  [...stationsEl.children].forEach(s=>{
    const m=s._m; if(!m) return;
    const mx=s.querySelector('.mx span');
    if(mx) mx.textContent=stationMeta(m);
  });
}
function layout(){
  W=innerWidth; H=innerHeight;
  U=Math.min(W,H)/2;
  const s=Math.max(.62,Math.min(1.3,U/520));
  document.documentElement.style.setProperty('--s', s.toFixed(3));
  CX=W/2; CY=H*0.465;
  RX=Math.min(U*1.02, W*0.335);
  RY=RX*0.52;                            // 椭圆再扁：接近 PPT 的透视压扁圆盘
  EM=Math.max(20,Math.min(30,RX*0.085));
  HUB=Math.max(76,Math.min(128,RX*0.24));

  /* 轨道 SVG（静态组与流动组同轴随 ROT 旋转） */
  const el=name=>ringG.querySelector('.'+name);
  const elF=name=>ringFlow.querySelector('.'+name);
  for(const name of ['rOuter','rMid','rim3d','rBand']){
    const e=el(name);
    e.setAttribute('cx',CX); e.setAttribute('cy',CY);
  }
  for(const name of ['flow1','flow2']){
    const e=elF(name);
    e.setAttribute('cx',CX); e.setAttribute('cy',CY);
  }
  const rx=RX, ry=RY;
  el('rOuter').setAttribute('rx',rx*1.14); el('rOuter').setAttribute('ry',ry*1.14);
  el('rMid').setAttribute('rx',rx);        el('rMid').setAttribute('ry',ry);
  el('rim3d').setAttribute('rx',rx);       el('rim3d').setAttribute('ry',ry);
  el('rBand').setAttribute('rx',rx);       el('rBand').setAttribute('ry',ry);
  elF('flow1').setAttribute('rx',rx);      elF('flow1').setAttribute('ry',ry);
  elF('flow2').setAttribute('rx',rx);      elF('flow2').setAttribute('ry',ry);
  const st=document.getElementById('dust');
  st.style.width=W+'px'; st.style.height=H+'px'; st.width=Math.round(W*DPR); st.height=Math.round(H*DPR);
  sctx.setTransform(DPR,0,0,DPR,0,0);
  const bandW=Math.max(15,RX*0.115);
  el('rBand').setAttribute('stroke-width',bandW);
  el('rim3d').setAttribute('stroke-width',bandW*1.08);
  el('rim3d').setAttribute('cy',CY+bandW*.5);   // 环带侧壁下沉：制造立体厚度
  el('gshad').setAttribute('cx',CX);
  el('gshad').setAttribute('rx',rx*0.9);
  el('gshad').setAttribute('ry',RY*0.62);
  el('gshad').setAttribute('cy',CY+RY*1.30);    // 地面阴影：垫在飞轮盘下方
  const rot=`rotate(${(ROT*180/Math.PI).toFixed(2)} ${CX.toFixed(1)} ${CY.toFixed(1)})`;
  ringG.setAttribute('transform',rot);
  ringFlow.setAttribute('transform',rot);
  const bw=Math.max(2.5,RX*0.0075);
  elF('flow1').setAttribute('stroke-width',bw+1);
  elF('flow2').setAttribute('stroke-width',bw);

  /* 六站定位：沿倾斜扁椭圆分布。圆盘徽标随景深缩放制造立体感，
     卡片保持统一尺寸与字号（文字大小格式全站一致）。
     卡片沿径向离心外摆，间距按「徽标视觉半径 + 卡片径向投影半宽 + 留白」计算，
     保证任意方位上标签都不压住自身图标 */
  [...stationsEl.children].forEach((s,i)=>{
    const f=i/6*Math.PI*2;                       // φ=0 顶部起
    const k=1-0.16*Math.cos(f);                  // 徽标景深系数（上远下近）
    const [px,py]=ringXY(f);
    s.style.transform=`translate3d(${px}px,${py}px,0)`;
    s.style.zIndex=Math.round(20+Math.round(18*(1-Math.cos(f))/2));
    const em=s.querySelector('.em');
    const ds=EM*2.25;
    em.style.width=ds+'px'; em.style.height=ds+'px';
    em.style.transform=`translate(-50%,-50%) scale(${k.toFixed(3)})`;
    const card=s.querySelector('.card');
    const ddx=px-CX, ddy=py-CY, rr=Math.hypot(ddx,ddy)||1;
    const ux=ddx/rr, uy=ddy/rr;                  // 径向单位向量
    const rE=ds/2*k;                             // 该站徽标视觉半径（已含景深缩放）
    const halfW=card.offsetWidth/2, halfH=card.offsetHeight/2;
    const proj=Math.abs(ux)*halfW+Math.abs(uy)*halfH;  // 卡片中心到其近缘的径向投影
    const gap=Math.max(13,EM*.6);                // 图标与卡片之间的最小可视留白
    const G=rE+proj+gap;                         // 卡片离心外摆距离
    card.style.transform=`translate(calc(${ux*G}px - 50%), calc(${uy*G}px - 50%))`;
  });

  /* 中枢引擎 */
  const hub=document.getElementById('hub');
  hub.style.left=CX+'px'; hub.style.top=CY+'px';
  hub.style.width=(HUB*2)+'px'; hub.style.height=(HUB*2)+'px';
  const lr=Math.min(24,HUB*.42);
  hub.style.fontSize=lr+'px';

  dust=[];
  makeDust();
}
const DPR=Math.min(2,devicePixelRatio||1);
const sctx=document.getElementById('dust').getContext('2d');

/* ================================================================
   尘埃 / 彗星（canvas 帧动画）
   ================================================================ */
let dust=[];
function makeDust(){
  const n=Math.max(16,Math.floor(RX*0.05));
  for(let i=0;i<n;i++) dust.push({ a:Math.random()*Math.PI*2, sp:.6+Math.random()*1.3, r:.8+Math.random()*1.5, warm:Math.random()<.6 });
}
let hoverId=null;
let t0=performance.now();
function frame(nowT){
  const t=(nowT-t0)/1000;
  sctx.clearRect(0,0,W,H);
  if(cockpitSpeed){ requestAnimationFrame(frame); return; }   // speedMode：停画 canvas 动效
  const comet=t*.42;                       // 顺时针彗星（单位：rad 相位）

  // 尘埃沿倾斜轨道漂移
  for(const d of dust){
    const ph=d.a+t*.14*d.sp;
    const wob=1+Math.sin(ph*3+d.sp)*.06;
    const [x,y]=ringXY(ph,wob);
    const a=.10+.20*(.5+.5*Math.sin(ph*4-t));
    sctx.globalAlpha=a;
    sctx.fillStyle=d.warm?P.dustW:P.dustN;
    sctx.beginPath(); sctx.arc(x,y,d.r,0,6.2832); sctx.fill();
  }
  // 悬停光束：中枢 → 该站
  const hv=MODULES.findIndex(m=>m.id===hoverId);
  if(hv>=0){
    const f=hv/6*Math.PI*2;
    const [ex,ey]=ringXY(f);
    const gx=CX+(ex-CX)*.16, gy=CY+(ey-CY)*.16;
    const glow=sctx.createLinearGradient(gx,gy,ex,ey);
    glow.addColorStop(0,'rgba(255,160,90,.0)');
    glow.addColorStop(1,'rgba(255,80,20,.55)');
    sctx.strokeStyle=glow; sctx.lineWidth=1.4;
    sctx.beginPath(); sctx.moveTo(gx,gy); sctx.lineTo(ex,ey); sctx.stroke();
    sctx.strokeStyle='rgba(255,150,80,.18)'; sctx.lineWidth=6;
    sctx.beginPath(); sctx.moveTo(gx,gy); sctx.lineTo(ex,ey); sctx.stroke();
  }
  // 彗星
  for(let i=0;i<3;i++){
    const ph=comet-i*.05;
    const [x,y]=ringXY(ph);
    const a=i===0?.9:.28-.06*i;
    sctx.globalAlpha=a;
    const rr=i===0?2.6:2.0-i*.3;
    sctx.fillStyle='#FF4200';
    sctx.beginPath(); sctx.arc(x,y,rr,0,6.2832); sctx.fill();
  }
  sctx.globalAlpha=1;
  requestAnimationFrame(frame);
}

/* ================================================================
   面板内容 —— 六模块详情浮层（数据由主程序经 yfw:overview 注入；
   无对应注入键显示等待 note；settings 保留静态偏好演示）

function refreshThemeJS(){
  const cs=getComputedStyle(document.documentElement), g=n=>cs.getPropertyValue(n).trim();
  P.dustW=g('--dustA')||P.dustW;  P.dustN=g('--dustB')||P.dustN;
  C.hist=g('--c-hist')||C.hist;   C.idle=g('--c-idle')||C.idle;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function noDataNote(msg){ return '<div class="note" style="margin-top:0">'+esc(msg||WAIT_NOTE)+'</div>'; }

function statusChip(st){ return st==='exec'?'c-run':st==='wait'?'c-wait':'c-idle'; }

      <div class="setting" data-sw="on"><div class="grow"><div class="t">自动压缩上下文</div><div class="m">接近窗口阈值时先行压缩</div></div><div class="sw on"></div></div>
      <div class="setting" data-sw="off"><div class="grow"><div class="t">声音提示</div><div class="m">任务完成时播放提示音</div></div><div class="sw"></div></div>
      <div class="setting" data-sw="off"><div class="grow"><div class="t">危险操作确认</div><div class="m">删除/覆盖等操作需确认</div></div><div class="sw disabled"></div></div>
      <div class="field">
        <div class="lab">默认模型</div>
        <div class="sel" data-sel="model"><span>${selValue.model}</span><span class="arr">▼</span></div>
        <div class="opts" data-opts="model">
          <div class="o">Qwen3.8-27B（本地）</div>
          <div class="o">DeepSeek-V4（云端）</div>
          <div class="o">自动路由（推荐）</div>
        </div>
      </div>
      <div class="field">
        <div class="lab">输出策略</div>
        <div class="sel" data-sel="speed"><span>${selValue.speed}</span><span class="arr">▼</span></div>
        <div class="opts" data-opts="speed">
          <div class="o">流畅优先</div>
          <div class="o">质量优先</div>
        </div>
      </div>
      ${tail}`;},
};

/* ================================================================
   面板开关
   ================================================================ */
const panel=document.getElementById('panel');
const veil=document.getElementById('veil');
let panelOpen=false;
let lastModule=null;
function renderPanel(id){
  const m=MODULES.find(x=>x.id===id); if(!m) return;
  document.getElementById('panelBody').innerHTML=PANEL_HTML[m.id](m);
  bindPanel();   /* settings 演示控件随 body 重渲后重新绑定（数据模块无此类控件则空转） */
}
function openPanel(id){
  const m=MODULES.find(x=>x.id===id); if(!m) return;
  lastModule=m.id;
  document.getElementById('panelName').textContent=m.name;
  document.getElementById('panelIdx').textContent=m.idx;
  document.getElementById('panelEn').textContent=m.en;
  document.getElementById('panelSub').textContent=m.sub;
  document.getElementById('panelOrb').innerHTML=m.glyph;
  renderPanel(m.id);
  panel.classList.add('open'); veil.classList.add('on'); panelOpen=true;
}
function closePanel(){
  panel.classList.remove('open'); veil.classList.remove('on'); panelOpen=false;
}
document.getElementById('panelClose').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });
/* hub 语义：面板开着时点击 = 收起（不上报）；关闭态点击 = 通知父进入工作界面 */
document.getElementById('hub').addEventListener('click', () => { if (panelOpen) { closePanel(); return } notifyHost('yfw:hub-click') });
document.getElementById('veil').addEventListener('click',closePanel);

/* ================================================================
   主题切换：浅色 / 深色（对齐 YFWorking 现有两档主题）
   ================================================================ */
function applyTheme(name){
  const root=document.documentElement;
  const changed=!root.classList.contains(name==='dark'?'theme-dark':'theme-light');
  root.classList.toggle('theme-dark',  name==='dark');
  root.classList.toggle('theme-light', name!=='dark');
  try{ localStorage.setItem('yfw-cockpit-theme', name); }catch(e){}
  document.querySelectorAll('.tseg button').forEach(b=>{
    const on=b.dataset.themeBtn===name;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
  });
  refreshThemeJS();
  if(panelOpen && lastModule) openPanel(lastModule);   // 重渲打开中的面板以匹配新主题
  if(changed) notifyHost('yfw:theme-change');          // 主题实变时上报（父窗口可不听）
}
document.querySelectorAll('.tseg button').forEach(b=>{
  b.addEventListener('click',()=>applyTheme(b.dataset.themeBtn));
});

function bindPanel(){
  document.querySelectorAll('#panelBody [data-sw]').forEach(el=>{
    const sw=el.querySelector('.sw');
    if(!sw||sw.classList.contains('disabled'))return;
    sw.addEventListener('click',()=>{
      sw.classList.toggle('on');
      el.dataset.sw=sw.classList.contains('on')?'on':'off';
    });
  });
  document.querySelectorAll('#panelBody [data-sel]').forEach(selEl=>{
    const key=selEl.dataset.sel;
    const opts=document.querySelector(`#panelBody [data-opts="${key}"]`);
    selEl.addEventListener('click',e=>{
      e.stopPropagation();
      const was=opts.classList.contains('show');
      document.querySelectorAll('#panelBody .opts.show').forEach(o=>o.classList.remove('show'));
      document.querySelectorAll('#panelBody .sel.open').forEach(o=>o.classList.remove('open'));
      if(!was){opts.classList.add('show');selEl.classList.add('open');}
    });
    opts.querySelectorAll('.o').forEach(o=>{
      o.addEventListener('click',e=>{
        e.stopPropagation();
        selValue[key]=o.textContent.trim();
        selEl.querySelector('span').textContent=selValue[key];
        opts.querySelectorAll('.o').forEach(x=>x.classList.remove('sel2'));
        o.classList.add('sel2');
        opts.classList.remove('show'); selEl.classList.remove('open');
      });
    });
  });
}

/* ================================================================
   启动
   ================================================================ */
buildStations();
const elCss=(name,v)=>document.querySelector(name).textContent=v;
elCss('#footR','会话 / 任务 / 智能体矩阵 / 知识库 / 用量统计 / 设置');
/* 应用主题（首帧前 head 脚本已加 class，这里同步控件与运行色）。
   解析顺序与 head 一致：URL query 优先（iframe 由主程序 ?theme= 驱动），localStorage 兜底。 */
let initTheme='light';
try{ var _initQ=new URLSearchParams(location.search).get('theme');
     if(_initQ==='dark'||_initQ==='light') initTheme=_initQ;
     else{ var _lt=localStorage.getItem('yfw-cockpit-theme'); if(_lt==='dark'||_lt==='light') initTheme=_lt; } }
catch(e){}
applyTheme(initTheme);
setSpeed(false);                                   /* speedMode 初值：默认动效开启 */
let ticking=false;
window.addEventListener('resize',()=>{
  if(!ticking){ ticking=true; requestAnimationFrame(()=>{ layout(); ticking=false; }); }
});
layout();
requestAnimationFrame(frame);
signalReady();                                     /* 首帧就绪后向父广播 yfw:ready */
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boost 驾驶舱 · Sierpinski 三角剖分</title>
<style>
  :root {
    --paper:#0B0E14; --panel:#11161F; --card:#161C28; --card-hv:#1E2533;
    --ink:#F0E6D8; --ink2:#B8AFA2; --faint:#6E7480;
    --line:rgba(255,180,140,.10); --line-hot:rgba(255,116,41,.45);
    /* 三角拼贴调色板（深色 / 浅色由主题切换） */
    --tri-fill:rgba(255,180,120,.06);
    --tri-fill2:rgba(160,210,235,.06);
    --tri-stroke:rgba(255,170,110,.17);
    --tri-stroke2:rgba(160,210,235,.45);
    --tri-strong:rgba(255,116,41,.55);
    --tri-hover:rgba(255,180,120,.85);
    /* logo */
    --logo-stroke:#FFE6CF;
    --logo-glow:radial-gradient(circle,rgba(255,116,41,.42),rgba(255,116,41,0) 65%);
    /* 控件 */
    --kbd-bg:rgba(255,255,255,.07); --kbd-bd:rgba(255,255,255,.15);
    /* 状态徽章 */
    --chip-run-fg:#FF7429;  --chip-run-bg:rgba(255,116,41,.16);
    --chip-num-fg:#B8AFA2;  --chip-num-bg:rgba(255,255,255,.06);
  }
  .theme-light {
    --paper:#FDF9F5; --panel:#FFFDFB; --card:#FFFFFF; --card-hv:#FFF6EF;
    --ink:#24272C; --ink2:#5E636C; --faint:#9AA1AC;
    --line:rgba(34,38,44,.10); --line-hot:rgba(255,116,41,.45);
    --tri-fill:rgba(255,116,41,.06);
    --tri-fill2:rgba(50,120,150,.06);
    --tri-stroke:rgba(200,100,40,.22);
    --tri-stroke2:rgba(50,120,150,.50);
    --tri-strong:rgba(255,116,41,.85);
    --tri-hover:rgba(255,116,41,.95);
    --logo-stroke:#1A1A1A;
    --logo-glow:radial-gradient(circle,rgba(255,116,41,.18),rgba(255,116,41,0) 65%);
    --kbd-bg:rgba(255,255,255,.7); --kbd-bd:rgba(34,38,44,.16);
  }
  /* 玻璃主题（2026-09-10 设计语言）：--paper 透明透出桌面 + 色板 = 实色基色 ×
     --glass-opacity 透明度（主程序 yfw:theme 写 --glass-opacity，缺省 0.3）。
     挂在 documentElement（首帧 head 中 body 未解析，与运行时 applyTheme 同元素）。 */
  .theme-dark-glass{
    --glass-opacity:.3;
    --paper:transparent;
    --panel:color-mix(in srgb,#11161F calc(var(--glass-opacity)*100%),transparent);
    --card:color-mix(in srgb,#161C28 calc(var(--glass-opacity)*100%),transparent);
    --card-hv:color-mix(in srgb,#1E2533 calc(var(--glass-opacity)*100%),transparent);
  }
  /* 玻璃磨砂：面板级 backdrop-filter（iframe 内 html 级 blur 无可见背景，改加在面板上，
     使三角拼贴/极光在面板后呈磨砂态） */
  .theme-dark-glass .hp-inner,
  .theme-dark-glass .dp-frame,
  .theme-dark-glass .tri-tip,
  .theme-dark-glass #toast,
  .theme-dark-glass #logoCap{
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  /* 极光主/副晕（变量名沿用 .a1/.a2） */
  .theme-dark-glass .bg .a1{background:radial-gradient(circle,rgba(255,116,41,.5),rgba(255,116,41,0) 68%);}
  .theme-dark-glass .bg .a2{background:radial-gradient(circle,rgba(80,160,200,.35),rgba(80,160,200,0) 66%);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;transition:background .4s ease,color .4s ease;}
  b,strong{font-weight:700;}

  /* 背景微动效 */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--paper);}
  .bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;will-change:transform;}
  .bg .a1{width:50vmax;height:50vmax;left:-15vmax;top:-12vmax;
    background:radial-gradient(circle,rgba(255,116,41,.45),rgba(255,116,41,0) 68%);
    animation:dr 60s ease-in-out infinite alternate;}
  .bg .a2{width:46vmax;height:46vmax;right:-12vmax;bottom:-12vmax;
    background:radial-gradient(circle,rgba(80,160,200,.30),rgba(80,160,200,0) 66%);
    animation:dr2 72s ease-in-out infinite alternate;}
  @keyframes dr{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(5vmax,3vmax,0) scale(1.1)}}
  @keyframes dr2{from{transform:translate3d(0,0,0) scale(1.08)}to{transform:translate3d(-4vmax,3vmax,0) scale(1)}}

  /* 画布 */
  #stage{position:fixed;inset:0;z-index:1;}
  #triCanvas{position:fixed;inset:0;z-index:2;width:100%;height:100%;display:block;}
  #logoSvg{position:fixed;left:50%;top:46%;z-index:3;transform:translate(-50%,-50%);
    cursor:pointer;transition:transform .25s ease;}
  #logoSvg:hover{transform:translate(-50%,-50%) scale(1.02);}
  /* logo 提示胶囊（hover 显现） */
  #logoCap{position:fixed;z-index:3;transform:translate(-50%,0);pointer-events:none;
    font-size:10px;letter-spacing:.14em;color:var(--ink2);white-space:nowrap;
    padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);
    opacity:0;transition:opacity .25s ease;}
  #logoSvg:hover ~ #logoCap{opacity:1;}
  #logoGlow{position:fixed;left:50%;top:46%;z-index:2;width:560px;height:560px;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:var(--logo-glow);animation:breath 4.5s ease-in-out infinite;}
  @keyframes breath{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5;}
    50%{transform:translate(-50%,-50%) scale(1.15);opacity:.2;}}

  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;z-index:8;pointer-events:none;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 22px;}
  #hud .brand{display:flex;align-items:center;gap:10px;pointer-events:auto;}
  #hud .logo{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 4px 10px rgba(255,90,15,.3));}
  #hud .logo img{width:100%;height:100%;object-fit:contain;}
  #hud .brand .t{font-size:18px;font-weight:700;letter-spacing:.06em;line-height:1.1;}
  #hud .brand .e{display:block;margin-top:3px;font-size:8px;letter-spacing:.32em;
    color:var(--faint);text-transform:uppercase;font-family:Arial,sans-serif;}

  /* 右上控件：主题切换已移除——驾驶舱跟随主程序内置主题（无独立明暗开关） */

  /* 提示气泡（hover 时跟随鼠标） */
  .tri-tip{position:fixed;z-index:10;pointer-events:none;background:var(--card);
    border:1px solid var(--line-hot);border-radius:10px;padding:7px 11px;
    box-shadow:0 10px 24px rgba(255,116,41,.18);opacity:0;transition:opacity .15s;
    white-space:nowrap;}
  .tri-tip.show{opacity:1;}
  .tri-tip .n{font-size:12px;font-weight:700;color:#FF7429;}
  .tri-tip .d{font-size:10px;color:var(--ink2);margin-top:2px;letter-spacing:.02em;}

  /* 涟漪 */
  .ripple{position:fixed;z-index:9;pointer-events:none;border:1.5px solid #FF7429;
    border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:.85;
    animation:rippleAnim .8s cubic-bezier(.22,.9,.3,1) forwards;}
  @keyframes rippleAnim{
    0%{transform:translate(-50%,-50%) scale(.1);opacity:.85;border-width:2px;}
    100%{transform:translate(-50%,-50%) scale(8);opacity:0;border-width:1px;}
  }
  .ripple.flash{animation:rippleFlash .55s cubic-bezier(.22,.9,.3,1) forwards;}
  @keyframes rippleFlash{
    0%{opacity:1;background:rgba(255,116,41,.18);transform:translate(-50%,-50%) scale(.4);}
    100%{opacity:0;background:rgba(255,116,41,0);transform:translate(-50%,-50%) scale(2.2);}
  }

  /* Toast */
  #toast{position:fixed;z-index:11;left:50%;bottom:54px;transform:translate(-50%,30px);
    background:var(--card);border:1px solid var(--line-hot);border-radius:12px;
    padding:10px 16px;box-shadow:0 14px 36px rgba(255,116,41,.25);
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
    max-width:360px;text-align:center;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  #toast .t{font-size:12.5px;font-weight:700;color:#FF7429;}
  #toast .d{font-size:10.5px;color:var(--ink2);margin-top:3px;line-height:1.55;}

  /* 底部操作提示 */
  #foot{position:fixed;left:0;right:0;bottom:0;z-index:8;pointer-events:none;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:8px 20px;font-size:10px;color:var(--faint);letter-spacing:.1em;}
  #foot .help{font-size:11px;color:var(--ink2);line-height:1.9;letter-spacing:.02em;}
  #foot .help b{color:#FF7429;font-weight:600;}
  #foot .help kbd{font-family:inherit;font-size:.9em;padding:1px 6px;border-radius:5px;
    border:1px solid var(--kbd-bd);background:var(--kbd-bg);color:var(--ink2);}

  /* 三角 hover 焦点环（SVG 内部描边，点亮效果）
     —— 2026-09-15：hover 放大 + 周围平缓过渡。
     transform-box:fill-box 让 scale 以**该三角自身**包围盒中心为原点
     （SVG 默认原点在 viewBox 左上角，直接 scale 会把三角甩飞）；
     .tri-near = 与被 hover 三角共顶点的邻居，做柔和衰减形成"光晕式"聚焦，
     全部走 transition ⇒ 进出都是缓动，无跳变。 */
  #triCanvas path.tri{
    transition:transform .18s ease, opacity .18s ease, stroke .18s ease;
    transform-box:fill-box; transform-origin:center;
  }
  #triCanvas path.tri-near{ opacity:.5; }
  #triCanvas path.tri-hover{
    transform:scale(1.22);
    stroke:#FFFFFF !important;stroke-width:2 !important;
    opacity:1;
    filter:drop-shadow(0 0 6px rgba(255,255,255,.8));
  }
  #triCanvas path.tri-selected{stroke:#FF7429 !important;stroke-width:2.4 !important;
    filter:drop-shadow(0 0 8px rgba(255,116,41,.6));}

  /* 主题切换 */
  body{transition:background .4s ease,color .4s ease;}

  @media (max-width:820px){
    #hud .brand .e{display:none;}
  }
  @media (max-width:520px){
    #hud .brand .t{font-size:15px;}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;}}

  /* speedMode：主程序经 yfw:theme 传入 speedMode=true 时，暂停全部装饰动画 */
  .cockpit-speed *, .cockpit-speed *::before, .cockpit-speed *::after {
    animation-play-state: paused !important; transition-duration: .001s !important; }
  /* speedMode + 玻璃主题：实色兜底（去半透明与 backdrop-filter 模糊，与主程序
     html.speed-mode[class*="-glass"] 实色兜底同语义——低配设备节能渲染） */
  .cockpit-speed.theme-dark-glass{
    --paper:#0B0E14;
    --panel:#11161F;
    --card:#161C28;
    --card-hv:#1E2533;
  }
  .cockpit-speed .hp-inner, .cockpit-speed .dp-frame, .cockpit-speed .tri-tip,
  .cockpit-speed #toast, .cockpit-speed #logoCap{
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
  }

  /* ===== 悬浮面板（切角矩形 + 细线边框） =====
     2026-09-15：改为**贴着按钮外侧展开**（锚定按钮外缘 + 10px 间隙，
     垂直居中于按钮，展开方向随按钮方位走），不再是相对 logo 中心的固定偏移——
     固定偏移在大窗口下会飘到远离按钮的地方，读起来与"这个按钮的详情"脱钩。 */
  .hover-panel{
    position:fixed; z-index:12; pointer-events:none;
    width:278px; height:150px;
    /* 单对角切角（左上 + 右下）—— 设计语言统一 */
    clip-path:polygon(13px 0, 100% 0, 100% calc(100% - 13px),
                      calc(100% - 13px) 100%, 0 100%, 0 13px);
    background:rgba(255,150,90,.55);   /* 只露出 1px 作为细边框 */
    opacity:0; transition:opacity .18s ease, transform .18s ease;
    filter:drop-shadow(0 10px 26px rgba(255,90,20,.22));
  }
  /* 入场方向：从按钮一侧滑出（右侧 → 向左收进，其余同理） */
  .hover-panel{ transform:translateX(8px) scale(.97); }
  .hover-panel.side-left { transform:translateX(8px)  scale(.97); }
  .hover-panel.side-right{ transform:translateX(-8px) scale(.97); }
  .hover-panel.side-top  { transform:translateY(8px)  scale(.97); }
  .hover-panel.side-bottom{ transform:translateY(-8px) scale(.97); }
  .hover-panel.show{opacity:1; transform:translateX(0) translateY(0) scale(1);}
  .hover-panel .hp-inner{
    position:absolute; inset:1px;
    /* 单对角切角（左上 + 右下）—— 外层 13px / 内层 12px，1px 细边 */
    clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px),
                      calc(100% - 12px) 100%, 0 100%, 0 12px);
    background:var(--card);
    padding:20px 22px 18px;
    box-sizing:border-box;
    display:flex; flex-direction:column; gap:7px; justify-content:center;
  }
  .hp-top{display:flex; align-items:center; gap:7px;}
  .hp-icon{width:15px; height:15px; flex:none; color:#FF7429; display:flex;}
  .hp-icon svg{width:100%; height:100%;}
  .hp-name{font-size:14px; font-weight:700; color:var(--ink); letter-spacing:.04em;}
  .hp-en{font-size:8px; letter-spacing:.20em; color:var(--faint);
    font-family:Arial, sans-serif; text-transform:uppercase; margin-left:auto;}
  .hp-body{font-size:10.5px; color:var(--ink2); line-height:1.62;}
  .hp-body .kv{display:flex; justify-content:space-between; gap:8px;}
  .hp-body .kv b{color:#FF7429; font-family:Arial; font-weight:700;}
  .hp-body .hint{margin-top:4px; font-size:9.5px; color:var(--faint); letter-spacing:.04em;}

  /* ===== 右侧详细面板（点击按钮展开） ===== */
  #detailPanel{
    position:fixed; z-index:14; top:0; right:0; height:100%;
    width:min(392px, 94vw);
    transform:translateX(104%);
    transition:transform .42s cubic-bezier(.22,.9,.28,1);
    pointer-events:none;
  }
  #detailPanel.open{transform:translateX(0); pointer-events:auto;}
  .dp-frame{
    position:absolute; inset:0;
    background:var(--panel);
    border-left:1px solid var(--line-hot);
    box-shadow:-22px 0 60px rgba(0,0,0,.45);
    display:flex; flex-direction:column;
  }
  .dp-frame::before{
    content:""; position:absolute; top:0; left:0; right:0; height:2.5px;
    background:linear-gradient(90deg,#FFA268,#FF4200);
    box-shadow:0 0 14px rgba(255,116,41,.6);
  }
  .dp-head{position:relative; padding:26px 24px 14px; border-bottom:1px solid var(--line);}
  .dp-close{
    position:absolute; top:14px; right:18px; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:transparent; border:1px solid transparent; border-radius:8px;
    color:var(--faint); font-size:13px; transition:all .2s;
  }
  .dp-close:hover{color:#FF7429; background:rgba(255,116,41,.12); border-color:rgba(255,116,41,.25);}
  .dp-title{display:flex; align-items:center; gap:11px;}
  .dp-orb{
    width:34px; height:34px; flex:none; color:#fff;
    border-radius:9px;
    background:linear-gradient(140deg,#FFA268,#FF4200);
    display:flex; align-items:center; justify-content:center;
  }
  .dp-orb svg{width:56%; height:56%;}
  .dp-title h2{font-size:18px; font-weight:700; color:var(--ink); letter-spacing:.05em;}
  .dp-en{font-size:8.5px; letter-spacing:.22em; color:var(--faint);
    font-family:Arial, sans-serif; text-transform:uppercase;}
  .dp-sub{margin-top:10px; font-size:11.5px; color:var(--ink2); line-height:1.7; padding-right:6px;}
  /* 功能入口主按钮（2026-09-15）：面板的核心动作＝把用户真正带进功能。
     视觉权重最高（品牌渐变 + 阴影），与只读数据区明确分层。 */
  .dp-cta{
    margin-top:14px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 14px; border:0; border-radius:9px; cursor:pointer; font-family:inherit;
    font-size:12.5px; font-weight:700; letter-spacing:.10em; color:#fff;
    background:linear-gradient(140deg,#FFA268,#FF4200);
    box-shadow:0 6px 18px rgba(255,90,20,.28);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .dp-cta::after{content:"→"; font-size:13px; letter-spacing:0;}
  .dp-cta:hover{transform:translateY(-1px); box-shadow:0 10px 26px rgba(255,120,40,.42); filter:brightness(1.06);}
  .dp-cta:active{transform:translateY(0); filter:brightness(.98);}
  .dp-cta:focus-visible{outline:2px solid #FF7429; outline-offset:2px;}
  .dp-body{
    flex:1; min-height:0; overflow-y:auto; padding:14px 24px 24px 6px;
    scrollbar-width:thin; scrollbar-color:rgba(255,116,41,.35) transparent;
  }
  .dp-body::-webkit-scrollbar{width:6px;}
  .dp-body::-webkit-scrollbar-thumb{background:rgba(255,116,41,.3); border-radius:3px;}
  .dp-sec{margin:14px 0 8px; font-size:9.5px; color:#FF7429; letter-spacing:.18em; font-weight:700;}
  .dp-sec:first-child{margin-top:0;}
  .dp-row{
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
    padding:9px 11px; background:var(--card); border:1px solid var(--line);
    border-radius:10px;
  }
  .dp-row .grow{flex:1; min-width:0;}
  .dp-row .t{font-size:12.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dp-row .m{font-size:10px; color:var(--faint); margin-top:2px;}
  .dp-dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .dp-chip{flex:none; font-size:9px; font-weight:600; padding:2px 8px; border-radius:999px; letter-spacing:.05em;}
  .dp-chip.run{color:#FF7429; background:rgba(255,116,41,.16);}
  .dp-chip.wait{color:#FFC53D; background:rgba(255,176,0,.14);}
  .dp-chip.idle{color:#9AA1AC; background:rgba(160,170,185,.14);}
  .dp-chip.num{color:var(--ink2); background:rgba(255,255,255,.06);}
  .dp-bar{height:6px; border-radius:4px; background:var(--track,#20262F); overflow:hidden;}
  .dp-bar i{display:block; height:100%; border-radius:4px;
    background:linear-gradient(90deg,#FFA268,#FF4200);}
  .dp-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .dp-grid.g3{grid-template-columns:repeat(3,1fr);}
  .dp-card{padding:10px 11px; background:var(--card); border:1px solid var(--line);
    border-radius:10px;}
  .dp-card .v{font-size:15px; font-weight:700; color:var(--ink); font-family:Arial;}
  .dp-card .k{font-size:9px; color:var(--faint); margin-top:4px; letter-spacing:.08em;}
  .dp-card.hot .v{color:#FF7429;}
  .dp-note{font-size:10px; color:var(--faint); margin-top:10px; line-height:1.7;}
  .dp-sw{position:relative; width:40px; height:22px; border-radius:999px; flex:none;
    background:var(--track,#20262F); cursor:pointer; transition:background .25s;}
  .dp-sw::after{content:""; position:absolute; top:2.5px; left:2.5px; width:17px; height:17px;
    border-radius:50%; background:#fff; transition:transform .25s;}
  .dp-sw.on{background:linear-gradient(90deg,#FF8A3D,#FF4200);}
  .dp-sw.on::after{transform:translateX(18px);}
  .dp-chart{display:flex; align-items:flex-end; gap:6px; height:96px; padding:6px 2px 0;}
  .dp-chart .c{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end;}
  .dp-chart .c i{width:100%; max-width:22px; border-radius:3px 3px 1px 1px;
    background:linear-gradient(180deg,#FFA268,rgba(255,116,41,.16));}
  .dp-chart .c span{font-size:8px; color:var(--faint);}

  .dp-veil{position:fixed; inset:0; z-index:13; background:rgba(0,0,0,.42);
    opacity:0; pointer-events:none; transition:opacity .35s;}
  .dp-veil.on{opacity:1; pointer-events:auto;}
</style>
<script>
/* 首帧前应用主题，避免闪烁。
   主题完全由主程序驱动：?theme=（iframe src 首帧直给，三值 dark/light/dark-glass，
   缺省 dark 即 :root 基线；head 中 body 未解析 → 挂 documentElement，与运行时 applyTheme 同元素）；
   本页无独立主题开关，运行期主题变化由主程序经 yfw:theme 热切（classList 增删，保留 cockpit-speed）。 */
try{var _q=new URLSearchParams(location.search).get('theme')||'dark';
     document.documentElement.className='theme-'+_q;}
catch(e){document.documentElement.className='theme-dark';}
</script>
</head>
<body>
  <div class="bg"><i class="a1"></i><i class="a2"></i></div>

  <!-- 拼贴画布 -->
  <svg id="triCanvas" aria-label="Sierpinski 三角拼贴"></svg>

  <!-- 中央 logo（boost.svg）：可点击 = 中枢（进入工作台 / 收起面板） -->
  <div id="logoGlow"></div>
  <img id="logoSvg" src="boost.svg" alt="Boost" draggable="false" title="点击进入工作台">
  <div id="logoCap">点击进入工作台</div>

  <!-- hover tip -->
  <div class="tri-tip" id="triTip">
    <div class="n" id="tipN"></div>
    <div class="d" id="tipD"></div>
  </div>

  <header id="hud">
    <div class="brand">
      <div class="logo" title="Boost">
        <img src="boost.svg" alt="Boost" draggable="false">
      </div>
      <div class="t">驾驶舱<span class="e">Boost</span></div>
    </div>
    <!-- 主题切换已移除：驾驶舱跟随主程序内置主题（?theme= 首帧 + yfw:theme 热切），无独立明暗开关 -->
  </header>

  <footer id="foot">
    <span class="help">
      <b>悬停按钮</b>看模块快照 · <b>点击按钮</b>右侧展开详细 · <b>面板内按钮</b>进入功能 · <b>点击中央 logo</b>进入工作台
    </span>
    <span id="footR"></span>
  </footer>

  <!-- 悬浮信息卡（切角矩形，跟随按钮） -->
  <div id="hoverPanel" class="hover-panel">
    <div class="hp-inner">
      <div class="hp-top">
        <span class="hp-icon" id="hpIcon"></span>
        <span class="hp-name" id="hpName"></span>
        <span class="hp-en" id="hpEn"></span>
      </div>
      <div class="hp-body" id="hpBody"></div>
    </div>
  </div>

  <!-- 右侧详细面板（点击按钮展开） -->
  <aside id="detailPanel">
    <div class="dp-frame">
      <div class="dp-head">
        <button class="dp-close" id="dpClose" title="收起">✕</button>
        <div class="dp-title">
          <span class="dp-orb" id="dpOrb"></span>
          <div>
            <h2 id="dpName">—</h2>
            <span class="dp-en" id="dpEn">—</span>
          </div>
        </div>
        <p class="dp-sub" id="dpSub"></p>
        <button class="dp-cta" id="dpCta" type="button">进入</button>
      </div>
      <div class="dp-body" id="dpBody"></div>
    </div>
  </aside>
  <div class="dp-veil" id="dpVeil"></div>

  <div id="toast" role="status" aria-live="polite">
    <div class="t" id="toastT"></div>
    <div class="d" id="toastD"></div>
  </div>

<script src="cockpit.js"></script>
</body>
</html>
